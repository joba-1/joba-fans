<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0e2a3a">
<title>Fan controller</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root {
  /* Base hue of this device (set from its number, see applyHue). Red and green are the signal
     colours (warn / ok): the hues used here keep well clear of both. */
  --h: 190;
  --bg: hsl(calc(var(--h) + 12) 30% 95%); --card: #ffffff; --ink: hsl(calc(var(--h) + 12) 52% 12%);
  --muted: hsl(calc(var(--h) + 16) 17% 42%); --line: hsl(calc(var(--h) + 13) 25% 87%);
  --accent: hsl(var(--h) 87% 33%); --accent-ink: #ffffff; --accent-soft: hsl(calc(var(--h) + 2) 60% 91%);
  --warn: #b3261e; --warn-soft: #fde8e6; --ok: #1b7f4b; --track: hsl(calc(var(--h) + 12) 22% 86%);
  --shadow: 0 1px 2px rgba(15,36,48,.06), 0 6px 20px rgba(15,36,48,.07);
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: hsl(calc(var(--h) + 10) 52% 8%); --card: hsl(calc(var(--h) + 9) 47% 13%); --ink: hsl(calc(var(--h) + 7) 40% 93%);
    --muted: hsl(calc(var(--h) + 11) 19% 61%); --line: hsl(calc(var(--h) + 10) 34% 20%);
    --accent: hsl(var(--h) 74% 56%); --accent-ink: hsl(calc(var(--h) + 2) 84% 7%); --accent-soft: hsl(calc(var(--h) + 6) 59% 16%);
    --warn: #ff8a80; --warn-soft: #3a1b1a; --ok: #5bd69a; --track: hsl(calc(var(--h) + 10) 33% 24%);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg: hsl(calc(var(--h) + 10) 52% 8%); --card: hsl(calc(var(--h) + 9) 47% 13%); --ink: hsl(calc(var(--h) + 7) 40% 93%);
  --muted: hsl(calc(var(--h) + 11) 19% 61%); --line: hsl(calc(var(--h) + 10) 34% 20%);
  --accent: hsl(var(--h) 74% 56%); --accent-ink: hsl(calc(var(--h) + 2) 84% 7%); --accent-soft: hsl(calc(var(--h) + 6) 59% 16%);
  --warn: #ff8a80; --warn-soft: #3a1b1a; --ok: #5bd69a; --track: hsl(calc(var(--h) + 10) 33% 24%);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: 0 16px calc(24px + env(safe-area-inset-bottom));
}
main { max-width: 1040px; margin: 0 auto; }
header { display: flex; align-items: center; gap: 12px; padding: 18px 0 14px; }
header img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
header h1 { font-size: 1.25rem; margin: 0; line-height: 1.15; }
header .sub { color: var(--muted); font-size: .82rem; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 5px; }
.dot.on { background: var(--ok); } .dot.bad { background: var(--warn); }
header .sp { flex: 1; }
.icon-btn {
  appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; cursor: pointer;
}
.icon-btn:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* At most two cards per row: four fans are 2 x 2, never 3 + 1. One column on a phone. */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(max(300px, calc(50% - 8px)), 1fr)); }
.card {
  background: var(--card); border-radius: var(--r); box-shadow: var(--shadow);
  padding: 16px; border: 1px solid transparent; transition: border-color .2s, background .2s;
}
.card.fault { border-color: var(--warn); }
.card.all { grid-column: 1 / -1; }
.top { display: flex; align-items: center; gap: 14px; }
.fan { width: 56px; height: 56px; flex: none; color: var(--accent); transition: color .3s; }
.card.off .fan { color: var(--muted); }
.card.fault .fan { color: var(--warn); }
.id { flex: 1; min-width: 0; }
.id h2 { margin: 0; font-size: 1.05rem; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.badge {
  display: inline-block; margin-top: 3px; padding: 1px 9px; border-radius: 99px; font-size: .75rem;
  font-weight: 600; background: var(--accent-soft); color: var(--accent);
}
.card.off .badge { background: var(--track); color: var(--muted); }
.card.fault .badge { background: var(--warn-soft); color: var(--warn); }
.rpm { text-align: right; font-variant-numeric: tabular-nums; min-width: 78px; }
.rpm b { font-size: 1.7rem; font-weight: 700; line-height: 1; display: block; }
.rpm small { color: var(--muted); font-size: .75rem; }
.pwr {
  appearance: none; flex: none; width: 48px; height: 48px; border-radius: 50%; cursor: pointer;
  border: 2px solid var(--line); background: transparent; color: var(--muted); display: grid; place-items: center;
  transition: all .15s;
}
.card:not(.off) .pwr { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pwr:active { transform: scale(.94); }

.slider { margin: 16px 2px 6px; display: flex; align-items: center; gap: 14px; }
.slider output { width: 3.4em; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.meta[hidden] { display: none; }
.meta { color: var(--muted); font-size: .78rem; margin: 0 2px 10px; display: flex; justify-content: space-between; }
input[type=range] {
  -webkit-appearance: none; appearance: none; flex: 1; height: 44px; background: transparent; margin: 0; cursor: pointer;
  touch-action: pan-y;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 10px; border-radius: 99px;
  background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--track) var(--p, 0%));
}
input[type=range]::-moz-range-track { height: 10px; border-radius: 99px; background: var(--track); }
input[type=range]::-moz-range-progress { height: 10px; border-radius: 99px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; margin-top: -10px;
  background: var(--card); border: 3px solid var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
input[type=range]::-moz-range-thumb {
  width: 24px; height: 24px; border-radius: 50%; background: var(--card); border: 3px solid var(--accent);
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.chip {
  appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
  border-radius: 12px; padding: 7px 2px 6px; font: inherit; font-size: .8rem; line-height: 1.2; min-height: 48px;
  transition: background .12s, border-color .12s;
}
.chip small { display: block; color: var(--muted); font-size: .72rem; font-variant-numeric: tabular-nums; }
.chip:hover { border-color: var(--accent); }
.chip, .pwr, .icon-btn { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.chip:active { transform: scale(.96); background: var(--accent-soft); }
/* "sent, not confirmed yet": shown at once on input, cleared when the device reports the new state */
.chip.pending { border-color: var(--accent); background: var(--accent-soft); animation: pulse .9s ease-in-out infinite; }
.chip[aria-pressed="true"].pending { color: var(--accent-ink); background: var(--accent); }
.pwr { position: relative; }
.pwr.pending::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid transparent;
  border-top-color: var(--accent); animation: spin .7s linear infinite; }
.slider output.pending { opacity: .6; }
.slider output.pending::before { content: "●"; font-size: .6em; margin-right: 5px; vertical-align: .15em; animation: blink .8s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 28%, transparent); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 50% { opacity: .15; } }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip[aria-pressed="true"] small { color: inherit; opacity: .85; }
.warn { margin: 12px 0 0; padding: 8px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: .85rem; }
.warn[hidden] { display: none; }
@media (max-width: 380px) { .chip { font-size: .72rem; } .rpm b { font-size: 1.45rem; } }

.empty { text-align: center; color: var(--muted); padding: 40px 0; }
footer { color: var(--muted); font-size: .76rem; text-align: center; margin-top: 22px; }
#toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translate(-50%, 30px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: .88rem;
  opacity: 0; pointer-events: none; transition: all .25s; max-width: 90vw; z-index: 10;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* settings */
dialog {
  border: 0; border-radius: var(--r); padding: 0; background: var(--card); color: var(--ink);
  width: min(640px, 100vw); max-height: 92vh; max-height: 92dvh; box-shadow: 0 20px 60px rgba(0,0,0,.45);
}
dialog::backdrop { background: rgba(5,15,20,.6); }
.dlg-h { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); z-index: 1; }
.dlg-h h2 { margin: 0; font-size: 1.1rem; }
.dlg-b { padding: 6px 18px 18px; overflow: auto; max-height: calc(92vh - 70px); max-height: calc(92dvh - 70px); }
fieldset { border: 0; border-top: 1px solid var(--line); margin: 14px 0 0; padding: 12px 0 0; }
legend { font-weight: 700; padding: 0 8px 0 0; font-size: .92rem; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 8px 0; }
.row.one { grid-template-columns: 1fr; }
label { display: flex; flex-direction: column; gap: 3px; font-size: .78rem; color: var(--muted); }
label.chk { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); font-size: .9rem; min-height: 40px; }
input[type=text], input[type=number], input[type=password], select {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; min-height: 42px; width: 100%;
}
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
.chrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 10px; align-items: end; margin: 8px 0 16px; padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
.chrow .nm, .chrow .ck { grid-column: 1 / -1; }
.chrow .ck { display: flex; gap: 20px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: .8rem; margin: 4px 0 0; }
.btn {
  appearance: none; border: 0; border-radius: 12px; padding: 11px 18px; font: inherit; font-weight: 600; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); min-height: 44px;
}
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn.danger { background: var(--warn-soft); color: var(--warn); }
.btn.dirty::before { content: "\25CF\00a0"; }
.unsaved-note { color: var(--warn); font-size: .85rem; align-self: center; }
.unsaved-note[hidden] { display: none; }
.dlg-h.unsaved h2::after { content: " \25CF"; color: var(--warn); }
.btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
table.st { width: 100%; border-collapse: collapse; font-size: .85rem; margin-top: 6px; }
table.st td { padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; word-break: break-word; }
table.st td:first-child { color: var(--muted); white-space: nowrap; }
@media (max-width: 560px) {
  /* A phone's 100vh is the height WITHOUT the address bar: a full-height sheet would be centred
     and its heading would slide under the bar. dvh is the visible height; the sheet is pinned
     to the top and keeps clear of a notch. */
  dialog { width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh; height: 100dvh; max-height: 100dvh;
           margin: 0; inset: 0; border-radius: 0; }
  .dlg-h { padding-top: calc(14px + env(safe-area-inset-top)); }
  .dlg-b { max-height: calc(100vh - 62px - env(safe-area-inset-top)); max-height: calc(100dvh - 62px - env(safe-area-inset-top));
           padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
  .row { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <img src="/logo.svg" alt="">
    <div>
      <h1 id="title">Fan controller</h1>
      <div class="sub"><span><i class="dot" id="dot"></i><span id="conn">…</span></span><span id="wifi"></span><span id="mq"></span></div>
    </div>
    <div class="sp"></div>
    <button class="icon-btn" id="openSet" aria-label="Settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden></p>
  <footer id="foot"></footer>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="dlg" aria-labelledby="dlgT">
  <div class="dlg-h" id="dlgH"><h2 id="dlgT"></h2><button class="icon-btn" id="closeSet" aria-label="Close">✕</button></div>
  <div class="dlg-b" id="dlgB"></div>
</dialog>

    online: "Online", offline: "No connection", mqttOn: "MQTT", mqttOff: "MQTT off",

    ledH: "Status-LED", ledMode: "LED", ledOff: "Aus (dunkel)", ledOnM: "An", ledDay: "Helligkeit tagsüber, %", ledNight: "Helligkeit nachts, %",

const L = (navigator.language || "en").toLowerCase().startsWith("de") ? "de" : "en";
const t = k => (T[L][k] ?? T.en[k] ?? k);

document.title = t("appName"); document.getElementById("title").textContent = t("appName");
document.getElementById("openSet").setAttribute("aria-label", t("settings"));
document.getElementById("closeSet").setAttribute("aria-label", t("close"));

/* ---------- tiny DOM helper (all server strings go through textContent) ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {

      const a = vals(secA) !== baseA, b = vals(secNet) !== baseB;
      for (const [btn, note, d] of [[save, noteA, a], [netSave, noteB, b]]) {
        btn.classList.toggle("dirty", d); btn.classList.toggle("ghost", !d); note.hidden = !d;
      }
      $("dlgH").classList.toggle("unsaved", a || b);
    }
  };
  api("/api/netstatus").then(ns => {
    const ago = s => s == null ? t("never") : (s < 90 ? s + " s" : s < 5400 ? Math.round(s / 60) + " min" : Math.round(s / 3600) + " h") + " " + t("ago");
    const rows = [[t("fw"), "fan-remote " + ns.version + " (" + ns.git + ")"], [t("ip"), ns.ip + " · " + ns.hostname], [t("ssid"), ns.ssid + " · " + ns.rssi + " dBm"],
      [t("uptime"), Math.floor(ns.uptimeS / 3600) + " h " + Math.floor(ns.uptimeS % 3600 / 60) + " min"], [t("heap"), (ns.freeHeap / 1024).toFixed(0) + " kB"],
      [t("pwrMode"), t(ns.power.mode === "standby" ? "modeStandby" : "modeActive") + " · " + ns.power.cpuMhz + " MHz · PWM " + ns.power.pwmHz + " Hz"],
      [t("health"), ns.health ? (ns.health.ok ? t("healthOk") : ns.health.issues.join(", ")) : "–"],
      ...ns.resources.map(r => [r.name, (r.host || "–") + " · " + r.status + " · " + ago(r.lastOkAgoS)])];
    stBox.append(h("table", { class: "st" }, rows.map(r => h("tr", {}, h("td", {}, r[0]), h("td", {}, r[1])))));
  }).catch(() => {});
}

/* The controller idles with a lower clock and WiFi modem sleep; the first packet after a
   pause is slow. A touch tells it to wake up before the real command follows. */
let lastWake = -1e9;
function wake() {
  const n = performance.now();
  if (n - lastWake > 20000) { lastWake = n; fetch("/api/wake").catch(() => {}); }
}
for (const ev of ["pointerdown", "keydown", "touchstart"]) addEventListener(ev, wake, { passive: true });

/* ---------- go ---------- */
api("/api/state").then(applyState).catch(markOffline);
connectEvents();
</script>
</body>
