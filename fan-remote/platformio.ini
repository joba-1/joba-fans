; platformio.ini — fan-remote (firmware for the 4-channel fan controller)
;
; Build-time defaults come from config.ini (gitignored; created from
; config.ini.template by pre_build.py). Runtime settings live in NVS.

[platformio]
default_envs = xiao_c3

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = arduino
board = seeed_xiao_esp32c3
extra_scripts = pre:pre_build.py
board_build.partitions = min_spiffs.csv   ; two 1.9 MB app slots, OTA-capable
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -std=gnu++17 -Wall -Wextra -Wno-unused-parameter
board_build.embed_files =
    web/index.html.gz
    web/logo.svg
    web/icon-32.png
    web/icon-180.png
lib_deps =
    https://github.com/tzapu/WiFiManager.git
    ESP32Async/ESPAsyncWebServer@^3.9.5
    ESP32Async/AsyncTCP@^3.4.10
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7

; Flash over USB-C (first flash of a new board)
[env:xiao_c3]
extends = common

; Same firmware on the XIAO ESP32-C6 (pin-compatible; the D-pin names map to its GPIOs)
[env:xiao_c6]
extends = common
board = seeed_xiao_esp32c6

; Flash over WiFi, pushed to the board's own web server (POST /api/update): the host only
; makes an outbound connection, no firewall port is needed.
;   pio run -e ota -t upload --upload-port fan-control-1        (XIAO ESP32-C3)
;   pio run -e ota_c6 -t upload --upload-port fan-control-1     (XIAO ESP32-C6)
[env:ota]
extends = env:xiao_c3
upload_protocol = custom
upload_command = "$PYTHONEXE" scripts/http_upload.py $UPLOAD_PORT $SOURCE
upload_port = fan-control-1

[env:ota_c6]
extends = env:xiao_c6
upload_protocol = custom
upload_command = "$PYTHONEXE" scripts/http_upload.py $UPLOAD_PORT $SOURCE
upload_port = fan-control-1

; Fallback: ArduinoOTA. The board connects back to the host, so the host needs an open port:
; sudo firewall-cmd --add-port=3333/tcp ; FAN_OTA_HOST_PORT=3333 pio run -e espota -t upload ...
[env:espota]
extends = env:xiao_c3
upload_protocol = espota
upload_port = fan-control-1

[env:espota_c6]
extends = env:xiao_c6
upload_protocol = espota
upload_port = fan-control-1

; Hardware-free unit tests: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
test_framework = unity
lib_deps = FanCore
lib_compat_mode = off
