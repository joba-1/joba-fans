; platformio.ini — fan-remote (firmware for the 4-channel fan controller)
;
; Build-time defaults come from config.ini (gitignored; created from
; config.ini.template by pre_build.py). Runtime settings live in NVS.

[platformio]
default_envs = xiao_c3

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = arduino
board = seeed_xiao_esp32c3
extra_scripts = pre:pre_build.py
board_build.partitions = min_spiffs.csv   ; two 1.9 MB app slots, OTA-capable
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -std=gnu++17 -Wall -Wextra -Wno-unused-parameter
board_build.embed_files =
    web/index.html.gz
    web/logo.svg
lib_deps =
    https://github.com/tzapu/WiFiManager.git
    ESP32Async/ESPAsyncWebServer@^3.9.5
    ESP32Async/AsyncTCP@^3.4.10
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7

; Flash over USB-C (first flash of a new board)
[env:xiao_c3]
extends = common

; Same firmware on the XIAO ESP32-C6 (pin-compatible; the D-pin names map to its GPIOs)
[env:xiao_c6]
extends = common
board = seeed_xiao_esp32c6

; Flash over WiFi: pio run -e ota -t upload --upload-port fan-a1b2c3.local
[env:ota]
extends = common
upload_protocol = espota
upload_port = fan.local

; The same for a XIAO ESP32-C6: pio run -e ota_c6 -t upload --upload-port fan-a1b2c3.local
[env:ota_c6]
extends = env:xiao_c6
upload_protocol = espota
upload_port = fan.local

; Hardware-free unit tests: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
test_framework = unity
lib_deps = FanCore
lib_compat_mode = off
